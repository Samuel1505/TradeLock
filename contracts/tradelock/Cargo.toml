[package]
name = "tradelock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tradelock deal contract: documents-against-payment with an MPC-controlled eBL title leg and a NEAR Intents cash leg."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] }
tradelock-evm = { path = "../tradelock-evm" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
near-parameters = "=0.38.0"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
sha3 = "=0.10.8"
bs58.workspace = true
serde_json.workspace = true
near-workspaces = { version = "=0.24.0", default-features = false, features = ["install"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
