[workspace]
resolver = "2"
members = ["tradelock-evm", "tradelock-proof", "tradelock", "cashrail-check", "mocks/mock-signer"]
exclude = [".external"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/samuelowen/tradelock"

[workspace.dependencies]
near-sdk = "=5.30.0"
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }
bs58 = "=0.5.1"
hex = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
