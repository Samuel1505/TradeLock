[package]
name = "mock-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "TEST ONLY. MockSigner: v1.signer stand-in for near-workspaces sandbox tests (S-05). Same request/response shapes and the same epsilon derivation as near/mpc, with a fixed local root key. Never deployed to testnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "=0.10.8", default-features = false }
bs58.workspace = true
hex.workspace = true
serde_json.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
